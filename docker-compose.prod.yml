services:
  db:
    image: postgres:16-alpine
    container_name: pulso-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-pulso}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pulso_secret_prod}
      POSTGRES_DB: ${DB_NAME:-pulso}
    volumes:
      - pulso_prod_pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pulso} -d ${DB_NAME:-pulso}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulso-api-prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-pulso}:${DB_PASSWORD:-pulso_secret_prod}@db:5432/${DB_NAME:-pulso}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  pulso_prod_pgdata:
