# Render Blueprint: Pulso API (NestJS) + PostgreSQL, both on the free plan.
# Render › New › Blueprint › pick this repository. It creates everything below.
databases:
  - name: pulso-db
    plan: free
    databaseName: pulso_db
    user: pulso

services:
  - type: web
    name: pulso-api
    runtime: node
    plan: free
    branch: main
    # Dev dependencies (Nest CLI, TypeScript) are needed to compile.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Apply pending migrations on every deploy, then start the API.
    startCommand: npx prisma migrate deploy && node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pulso-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Demo account created at startup so your reviewer can sign in right away.
      - key: DEMO_EMAIL
        value: profesor@pulso.app
      - key: DEMO_NAME
        value: Profesor
      - key: DEMO_PASSWORD
        sync: false
