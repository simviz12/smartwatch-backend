name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pulso_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting and lint
        run: npm run lint

      - name: Run Prisma generate and migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/pulso_db?schema=public
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Run unit tests
        run: npm run test

      - name: Run e2e tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/pulso_db?schema=public
          JWT_SECRET: ci_test_secret_for_environment_validation_must_be_long
          LLM_API_KEY: ci_test_key
          LLM_CHAT_MODEL: test-model
          LLM_CLASSIFIER_MODEL: test-classifier
        run: npm run test:e2e

      - name: Build project
        run: npm run build
