openapi: 3.0.0
paths:
  /health:
    get:
      operationId: HealthController_getHealth
      summary: Retrieve service and database health status
      parameters: []
      responses:
        "200":
          description: Service health check response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: pulso-api
                  version:
                    type: string
                    example: 0.1.0
                  time:
                    type: string
                    example: 2026-10-13T01:40:00.000Z
                  database:
                    type: string
                    example: up
      tags:
        - Health
  /chat/stream:
    post:
      operationId: ChatController_streamChat
      summary: SSE Stream for conversational emotional support with crisis safety
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatDto"
      responses:
        "200":
          description: ""
      tags:
        - Chat
  /v1/installs/me:
    delete:
      operationId: InstallController_deleteInstall
      summary: Delete install record and purge server counters
      parameters: []
      responses:
        "200":
          description: ""
      tags:
        - Install & Privacy
info:
  title: Pulso API
  description: Pulso Wellness & Emotional Support Chat API
  version: 0.1.0
  contact: {}
tags:
  - name: Health
    description: System and database health diagnostics
servers: []
components:
  schemas:
    SendChatDto:
      type: object
      properties: {}
